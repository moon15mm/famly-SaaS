# «من بيوتنا» demo — buyutna.wardat.xyz
# Installed as /etc/nginx/sites-available/buyutna.wardat.xyz and linked from sites-enabled.
# The app listens on loopback only: 8430 (API) and 8431 (web) from deploy/server/compose.yaml.

server {
    listen 80;
    listen [::]:80;
    server_name buyutna.wardat.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name buyutna.wardat.xyz;

    ssl_certificate /etc/letsencrypt/live/buyutna.wardat.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buyutna.wardat.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/buyutna.access.log;
    error_log  /var/log/nginx/buyutna.error.log warn;

    # Matches the API's own 6 MB request limit (5 MB images plus form overhead).
    client_max_body_size 6m;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # The app already sends CSP, nosniff, frame and referrer headers; only HSTS is added here.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Interactive API docs stay private, as in the original Caddy setup.
    location ^~ /api/docs { return 404; }
    location = /api/openapi.json { return 404; }

    # The API trusts the first X-Forwarded-For entry for rate limits,
    # so it is overwritten with the real client address instead of appended.
    location /api/ {
        proxy_pass http://127.0.0.1:8430;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8430;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8431;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
