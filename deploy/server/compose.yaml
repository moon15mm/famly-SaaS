# Demo deployment of «من بيوتنا» on the shared wardat.xyz server.
# Host nginx terminates TLS for buyutna.wardat.xyz and proxies to the loopback ports below;
# nothing here publishes a public port or touches the other apps on the server.
# Secrets come from deploy/server/.env, created on the server and never committed.
name: min-buyutna

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}

x-backend: &backend
  image: min-buyutna-api:server
  build:
    context: ../..
    dockerfile: deploy/backend.Dockerfile
  environment:
    APP_ENV: staging
    DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/market
    PUBLIC_ORIGIN: https://buyutna.wardat.xyz
    COOKIE_SECURE: 'true'
    PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-tap}
    PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET}
    TAP_PUBLIC_KEY: ${TAP_PUBLIC_KEY:-}
    TAP_SECRET_KEY: ${TAP_SECRET_KEY:-}
    PRIVATE_LINK_SECRET: ${PRIVATE_LINK_SECRET:?Set PRIVATE_LINK_SECRET}
    MAIL_TRANSPORT: disabled
    AI_PROVIDER: disabled
    MEDIA_DIR: /app/data/media
    PRIVATE_DIR: /app/data/private
    # Only nginx on this host reaches the loopback port, and it overwrites X-Forwarded-For.
    FORWARDED_ALLOW_IPS: '*'
  volumes:
    - media:/app/data/media
    - private:/app/data/private
  networks: [internal, edge]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 512m
  cpus: 0.75
  logging: *logging

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U market -d market]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    logging: *logging
  migrate:
    <<: *backend
    command: [sh, -c, 'alembic -c backend/alembic.ini upgrade head && python -m app.bootstrap']
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *backend
    ports: ['127.0.0.1:8430:8000']
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5)']
      interval: 20s
      timeout: 8s
      retries: 5
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    image: min-buyutna-web:server
    build:
      context: ../..
      dockerfile: deploy/frontend.Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports: ['127.0.0.1:8431:3000']
    networks: [internal, edge]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.75
    logging: *logging

volumes:
  postgres:
  media:
  private:

networks:
  internal:
    internal: true
  edge:
