name: Android app
on:
  push:
    paths: ['android/**', 'scripts/test-android-bridge.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Bridge download tests
        working-directory: .
        run: node --test scripts/test-android-bridge.mjs
      # Release signing only when the repository secrets exist; otherwise the release AAB/APK stay unsigned.
      - name: Prepare upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "MINBUYUTNA_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release builds will be signed with the upload key."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; release outputs are unsigned."
          fi
      - name: Unit tests, lint and release builds
        env:
          MINBUYUTNA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MINBUYUTNA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MINBUYUTNA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon --console=plain
          -PversionCode=$((GITHUB_RUN_NUMBER + 10))
          testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease bundleRelease
      - name: Verify release signature and manifest
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)" | tee ../android-manifest.txt
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -iE "debuggable|allowBackup|usesCleartextTraffic|exported" | tee -a ../android-manifest.txt
          if "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -q 'debuggable.*=true'; then echo "::error::release is debuggable"; exit 1; fi
          if [ -n "$MINBUYUTNA_KEYSTORE" ]; then
            "$BT/apksigner" verify --verbose --print-certs "$APK" | tee -a ../android-manifest.txt
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1 | tee -a ../android-manifest.txt
          fi
          sha256sum app/build/outputs/bundle/release/*.aab app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk | tee -a ../android-manifest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/tests/
            android-manifest.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
