name: Verify marketplace
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_DB: min_buyutna_test_ci, POSTGRES_USER: market, POSTGRES_PASSWORD: ci-only-not-production}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - run: pip install -r backend/requirements.lock
      - run: ruff check backend scripts
      - run: bandit -r backend/app -ll
      - run: pytest -q
      - run: pytest -q
        env: {TEST_DATABASE_URL: 'postgresql+psycopg://market:ci-only-not-production@localhost:5432/min_buyutna_test_ci'}
      - run: alembic -c backend/alembic.ini upgrade head
        env: {PYTHONPATH: backend, DATABASE_URL: 'postgresql+psycopg://market:ci-only-not-production@localhost:5432/min_buyutna_test_ci'}
      - run: alembic -c backend/alembic.ini check
        env: {PYTHONPATH: backend, DATABASE_URL: 'postgresql+psycopg://market:ci-only-not-production@localhost:5432/min_buyutna_test_ci'}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend
