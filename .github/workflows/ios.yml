name: iOS app
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to TestFlight / App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_READY: ${{ secrets.ASC_KEY_ID != '' && 'yes' || 'no' }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Unit tests (iPhone simulator)
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' | head -1)
          echo "Testing on $DEVICE"
          set -o pipefail
          xcodebuild test -project MinBuyutna.xcodeproj -scheme MinBuyutna \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/test.log" 2>&1 \
            || { grep -E "error:|Failing|failed" "$RUNNER_TEMP/test.log" | sort -u | head -80; exit 1; }
          grep -E "Test Suite|Executed|passed|failed" "$RUNNER_TEMP/test.log" | tail -40
      - name: iPad build
        run: |
          set -o pipefail
          xcodebuild build -project MinBuyutna.xcodeproj -scheme MinBuyutna -configuration Release \
            -destination "generic/platform=iOS Simulator" TARGETED_DEVICE_FAMILY="1,2" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/ipad.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/ipad.log" | sort -u | head -60; exit 1; }
          grep -cE "warning:" "$RUNNER_TEMP/ipad.log" || true
      - name: Release archive (unsigned check)
        if: env.ASC_READY == 'no'
        run: |
          set -o pipefail
          xcodebuild archive -project MinBuyutna.xcodeproj -scheme MinBuyutna -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/MinBuyutna.xcarchive" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -60; exit 1; }
          tail -3 "$RUNNER_TEMP/archive.log"
          echo "::warning::App Store Connect secrets are not set; the archive is unsigned and cannot be uploaded."
      # Cloud-managed signing with an App Store Connect API key (role: Admin or App Manager).
      - name: Signed archive and upload
        if: env.ASC_READY == 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project MinBuyutna.xcodeproj -scheme MinBuyutna -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/MinBuyutna.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" "${AUTH[@]}" | tail -30
          DEST=export; [ "$UPLOAD" = "true" ] && DEST=upload
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MinBuyutna.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" "${AUTH[@]}" | tail -30
          codesign -dv --verbose=2 "$RUNNER_TEMP/MinBuyutna.xcarchive/Products/Applications/MinBuyutna.app" 2>&1 | tee "$RUNNER_TEMP/signature.txt"
          rm -f "$KEY"
      - name: Inspect the release bundle
        run: |
          APP="$RUNNER_TEMP/MinBuyutna.xcarchive/Products/Applications/MinBuyutna.app"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|ShortVersionString|Version|DisplayName)|PlatformURL|NSAllows|UIBackgroundModes" -A2 | tee "$RUNNER_TEMP/bundle.txt"
          test -f "$APP/PrivacyInfo.xcprivacy" && echo "Privacy manifest present" | tee -a "$RUNNER_TEMP/bundle.txt"
          if strings "$APP/MinBuyutna" | grep -q "get-task-allow"; then echo "::warning::debug entitlement string found"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            ${{ runner.temp }}/tests.xcresult
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/signature.txt
            ${{ runner.temp }}/bundle.txt
          if-no-files-found: warn
          retention-days: 30
