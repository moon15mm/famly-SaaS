plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The hosted demo by default; pass -PplatformUrl=http://localhost:3000 for the USB development build.
def platformUrl = providers.gradleProperty('platformUrl').getOrElse('https://buyutna.wardat.xyz')
if (!(platformUrl ==~ /https?:\/\/[A-Za-z0-9.\-\[\]:]+\/?/)) {
    throw new GradleException('platformUrl must be an HTTP(S) origin without credentials, path, query or fragment')
}

android {
    namespace 'sa.minbuyutna.app'
    compileSdk 35
    defaultConfig {
        applicationId 'sa.minbuyutna.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
        buildConfigField 'String', 'PLATFORM_URL', '"' + platformUrl + '"'
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    buildTypes {
        debug {
            applicationIdSuffix '.local'
            signingConfig signingConfigs.debug
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError true }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!platformUrl.startsWith('https://')) {
            throw new GradleException('Release builds require -PplatformUrl=https://your-real-host')
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}

// coil's dependency tree still pins the empty kotlin-stdlib-jdk7/jdk8 shims at 1.8.21. Align them with a
// version present in the local dependency cache so offline builds, including lint's test classpaths, resolve.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
            details.useVersion '1.9.20'
            details.because 'empty shims since Kotlin 1.8; keeps offline builds resolvable'
        }
    }
}
