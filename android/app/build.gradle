plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The hosted demo by default; pass -PplatformUrl=http://localhost:3000 for the USB development build.
def platformUrl = providers.gradleProperty('platformUrl').getOrElse('https://buyutna.wardat.xyz')
if (!(platformUrl ==~ /https?:\/\/[A-Za-z0-9.\-\[\]:]+\/?/)) {
    throw new GradleException('platformUrl must be an HTTP(S) origin without credentials, path, query or fragment')
}

android {
    namespace 'sa.minbuyutna.app'
    compileSdk 35
    defaultConfig {
        applicationId 'sa.minbuyutna.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        buildConfigField 'String', 'PLATFORM_URL', '"' + platformUrl + '"'
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    buildTypes {
        debug {
            applicationIdSuffix '.local'
            signingConfig signingConfigs.debug
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError true }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!platformUrl.startsWith('https://')) {
            throw new GradleException('Release builds require -PplatformUrl=https://your-real-host')
        }
    }
}

dependencies {
    // Native driver screens; the web screens keep using the platform WebView.
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
